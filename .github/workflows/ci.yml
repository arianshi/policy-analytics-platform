name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, test, coverage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (unit, integration, LLM/hallucination, data-quality, perf) - fully offline
        run: pytest -o addopts="" --cov=app --cov-report=term:skip-covered --cov-report=xml --junitxml=junit.xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "backend/coverage.xml\nbackend/junit.xml" }

  frontend:
    name: Frontend - lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage/lcov.info }

  images:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (offline data, no secrets)
        run: |
          LIVE_DATA=false docker compose up --build -d
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break || sleep 2; done
      - name: End-to-end smoke test through the API
        run: |
          ID=$(curl -fsS -X POST localhost:8000/api/analyses -H 'content-type: application/json' \
               -d '{"query":"Analyse employment trends in the technology sector from 2020-2024"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 40); do
            S=$(curl -fsS localhost:8000/api/analyses/$ID | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            case "$S" in completed|degraded) exit 0;; failed) exit 1;; esac; sleep 1
          done; exit 1
      - run: curl -fsS localhost:3000/ >/dev/null
      - if: always()
        run: docker compose logs --no-color | tail -100 && docker compose down -v

  publish:
    name: Publish images (main + tags)
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { component: [backend, frontend] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.component == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.PUBLIC_API_URL || 'http://localhost:8000') || '' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to production host
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    environment: production # configure required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Roll out over SSH (pulls the sha-tagged images, restarts with the runtime secrets)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.yml "$HOST":~/policy-analytics/
          ssh -i key "$HOST" "cd ~/policy-analytics && \
            OPENAI_API_KEY='$OPENAI_API_KEY' GEMINI_API_KEY='$GEMINI_API_KEY' AZURE_OPENAI_API_KEY='$AZURE_OPENAI_API_KEY' \
            docker compose pull && docker compose up -d"
