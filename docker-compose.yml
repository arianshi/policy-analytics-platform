# Local / single-host deployment:  cp .env.example .env  &&  docker compose up --build
# API keys are read from .env at *run* time (never baked into an image).
services:
  backend:
    build: ./backend
    image: policy-analytics-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      LIVE_DATA: ${LIVE_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-openai,gemini,bedrock,azure,offline}
      ALLOW_FAULT_INJECTION: ${ALLOW_FAULT_INJECTION:-true}
    ports:
      - "8000:8000"
    volumes:
      - pap-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    image: policy-analytics-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pap-data:
